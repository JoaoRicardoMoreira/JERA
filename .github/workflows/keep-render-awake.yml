name: Keep Render API awake

on:
  schedule:
    # Offset from the top of the hour to reduce GitHub Actions queue delays.
    - cron: '3/10 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Call the Render health endpoint
        run: |
          curl --fail --silent --show-error --max-time 60 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            https://jera-api.onrender.com/api/v1/health
