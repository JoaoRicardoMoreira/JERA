<section class="fc-surface p-6">
  <h3 class="mb-5 flex items-center gap-3 text-xl font-semibold">
    <span class="grid h-9 w-9 place-items-center rounded-xl border border-emerald-400/20 bg-emerald-500/10 text-emerald-300">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
        <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z" />
      </svg>
    </span>
    Metas por Categoria
  </h3>
  <div class="space-y-4">
    <div *ngFor="let cat of expenseCategories" class="space-y-2">
      <div class="flex items-center justify-between gap-4 text-sm">
        <span class="min-w-0 truncate text-zinc-300">{{ cat.name }}</span>
        <div class="flex shrink-0 items-center gap-2">
          <span [class]="isExceeded(cat) ? 'text-rose-400 font-medium' : 'text-zinc-400 font-medium'">
            {{ currency(spentFor(cat)) }} / {{ currency(amountFor(cat)) }}
          </span>
          <button type="button" (click)="edit(cat)" class="fc-button fc-button-ghost !min-h-8 !p-2" title="Editar meta">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
              <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
            </svg>
          </button>
        </div>
      </div>
      <div class="fc-progress-track h-2">
        <div
          [class]="isExceeded(cat) ? 'bg-rose-500' : 'bg-emerald-500'"
          class="h-full rounded-full transition-all duration-500"
          [style.width.%]="Math.min(progressFor(cat), 100)"
        ></div>
      </div>
    </div>
  </div>
</section>
