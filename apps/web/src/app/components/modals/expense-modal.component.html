<div *ngIf="open" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 px-4 backdrop-blur-sm">
  <div class="w-full max-w-lg">
    <div class="mb-4 flex justify-end">
      <button type="button" (click)="close.emit()" class="fc-button fc-button-ghost !min-h-9 !p-2" aria-label="Fechar">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <app-expense-form [categories]="categories" [disabled]="disabled" (addExpense)="submit($event)"></app-expense-form>
  </div>
</div>
