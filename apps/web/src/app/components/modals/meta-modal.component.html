<div *ngIf="open" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 px-4 backdrop-blur-sm">
  <div class="fc-surface w-full max-w-md p-8">
    <h3 class="mb-2 text-2xl font-bold">Definir Meta</h3>
    <p class="mb-6 font-medium text-emerald-400">{{ category }}</p>
    <form (ngSubmit)="submit()" class="space-y-4">
      <input type="number" step="0.01" [(ngModel)]="value" name="metaValue" placeholder="Valor da meta" class="fc-field mb-6 w-full px-4 text-xl" />
      <div class="flex gap-3">
        <button type="button" (click)="close.emit()" class="fc-button fc-button-secondary flex-1">Cancelar</button>
        <button type="submit" [disabled]="disabled" class="fc-button fc-button-primary flex-1">Definir Meta</button>
      </div>
    </form>
  </div>
</div>
