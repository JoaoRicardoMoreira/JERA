<div *ngIf="open" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 px-4 backdrop-blur-sm">
  <div class="w-full max-w-lg overflow-hidden rounded-[1.75rem] border border-white/8 bg-[#090909]">
    <div class="flex items-start justify-between border-b border-white/5 px-7 py-6">
      <div>
        <p class="text-xs font-medium uppercase tracking-[0.38em] text-zinc-500">Nova renda</p>
        <h3 class="mt-2 text-2xl font-bold text-white">Adicionar entrada</h3>
      </div>
      <button type="button" (click)="close.emit()" class="fc-button fc-button-ghost !min-h-9 !p-2" aria-label="Fechar">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <form class="space-y-5 px-7 py-7" (ngSubmit)="submit()">
      <div>
        <label class="mb-2 block text-xs font-medium uppercase tracking-[0.28em] text-zinc-500">Descricao</label>
        <input
          type="text"
          [(ngModel)]="form.desc"
          name="incomeDesc"
          required
          placeholder="Ex: Salario Tech Co"
          class="fc-field w-full px-4"
        />
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label class="mb-2 block text-xs font-medium uppercase tracking-[0.28em] text-zinc-500">Valor</label>
          <input type="number" [(ngModel)]="form.valor" name="incomeValor" step="0.01" required class="fc-field w-full px-4" />
        </div>
        <div>
          <label class="mb-2 block text-xs font-medium uppercase tracking-[0.28em] text-zinc-500">Data</label>
          <input type="date" [(ngModel)]="form.data" name="incomeData" required class="fc-field w-full px-4 text-sm" />
        </div>
      </div>

      <div *ngIf="incomeCategories.length > 0">
        <label class="mb-2 block text-xs font-medium uppercase tracking-[0.28em] text-zinc-500">Categoria</label>
        <select [(ngModel)]="form.categoryId" name="incomeCategoryId" class="fc-field w-full px-4">
          <option value="">Sem categoria</option>
          <option *ngFor="let cat of incomeCategories" [value]="cat.id">{{ cat.name }}</option>
        </select>
      </div>

      <div class="grid grid-cols-1 gap-3 pt-3 sm:grid-cols-2">
        <button type="button" (click)="close.emit()" class="fc-button fc-button-secondary !min-h-12">Cancelar</button>
        <button type="submit" [disabled]="disabled" class="fc-button fc-button-primary !min-h-12">Adicionar Renda</button>
      </div>
    </form>
  </div>
</div>
