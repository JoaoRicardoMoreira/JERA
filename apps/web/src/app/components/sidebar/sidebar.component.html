<button
  type="button"
  (click)="toggle()"
  class="fc-button fc-button-secondary fixed left-4 top-4 z-50 !p-2 lg:hidden"
  aria-label="Abrir navegacao"
>
  <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
  </svg>
</button>

<aside
  class="fixed left-0 top-0 z-40 h-screen border-r border-white/5 bg-zinc-950/95 backdrop-blur-md transition-all duration-300 lg:sticky"
  [class.-translate-x-full]="collapsed"
  [class.lg:translate-x-0]="true"
  [class.w-64]="!collapsed"
  [class.lg:w-20]="collapsed"
>
  <div class="flex h-full flex-col p-5">
    <div class="mb-10 flex items-center gap-3">
      <img src="assets/brand/jera-mark-reference.png" alt="Jera" class="h-8 w-auto shrink-0" />
      <span *ngIf="!collapsed" class="text-lg font-bold text-white">Jera</span>
      <button type="button" (click)="toggle()" class="fc-button fc-button-ghost ml-auto hidden !min-h-8 !p-2 lg:inline-flex" aria-label="Alternar menu">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" [class.rotate-180]="collapsed" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>

    <nav class="flex-1 space-y-2">
      <a
        *ngFor="let item of items"
        [routerLink]="item.path"
        routerLinkActive="bg-white/[0.06] text-white"
        [routerLinkActiveOptions]="{ exact: true }"
        class="group relative flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-zinc-500 transition hover:bg-white/[0.04] hover:text-zinc-100"
      >
        <span class="text-emerald-400/90" [class.mx-auto]="collapsed">
          <svg *ngIf="item.icon === 'home'" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
            <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2H3V4zm0 4h14v8a1 1 0 01-1 1H4a1 1 0 01-1-1V8z" />
          </svg>
          <svg *ngIf="item.icon === 'up'" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 3a1 1 0 01.707.293l4 4a1 1 0 01-1.414 1.414L11 6.414V16a1 1 0 11-2 0V6.414L6.707 8.707A1 1 0 015.293 7.293l4-4A1 1 0 0110 3z" clip-rule="evenodd" />
          </svg>
          <svg *ngIf="item.icon === 'down'" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 17a1 1 0 01-.707-.293l-4-4a1 1 0 111.414-1.414L9 13.586V4a1 1 0 112 0v9.586l2.293-2.293a1 1 0 011.414 1.414l-4 4A1 1 0 0110 17z" clip-rule="evenodd" />
          </svg>
          <svg *ngIf="item.icon === 'sync'" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h5M20 20v-5h-5M5 15a7 7 0 0012 3M19 9A7 7 0 007 6" />
          </svg>
          <svg *ngIf="item.icon === 'chart'" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
            <path d="M3 15.25A1.25 1.25 0 004.25 16.5h11.5a.75.75 0 000-1.5H4.5V4.25a.75.75 0 00-1.5 0v11z" />
            <path d="M6 12.5a1 1 0 001 1h.5a1 1 0 001-1v-3a1 1 0 00-1-1H7a1 1 0 00-1 1v3zM10 12.5a1 1 0 001 1h.5a1 1 0 001-1v-6a1 1 0 00-1-1H11a1 1 0 00-1 1v6zM14 12.5a1 1 0 001 1h.5a1 1 0 001-1v-8a1 1 0 00-1-1H15a1 1 0 00-1 1v8z" />
          </svg>
        </span>
        <span *ngIf="!collapsed">{{ item.label }}</span>
      </a>
    </nav>

    <div class="border-t border-white/5 pt-5">
      <a routerLink="/configuracoes" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-zinc-500 hover:bg-white/[0.04] hover:text-zinc-100">
        <span class="h-8 w-8 rounded-full bg-white/[0.06]"></span>
        <span *ngIf="!collapsed">Configuracoes</span>
      </a>
    </div>
  </div>
</aside>

<div *ngIf="!collapsed" (click)="toggle()" class="fixed bottom-0 left-64 right-0 top-0 z-30 bg-black/55 lg:hidden"></div>
