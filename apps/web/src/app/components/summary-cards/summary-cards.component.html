<div class="mb-8 grid grid-cols-1 gap-6 md:grid-cols-3">
  <div class="fc-surface p-6">
    <div class="mb-3 flex items-start justify-between gap-4">
      <div>
        <p class="text-sm text-zinc-400">Saldo previsto no periodo</p>
        <h2 class="mt-1 text-3xl font-bold text-zinc-100">{{ currency(saldo) }}</h2>
      </div>
      <span class="grid h-9 w-9 place-items-center rounded-xl border border-white/10 bg-white/5 text-zinc-300">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path d="M10 2a8 8 0 100 16 8 8 0 000-16zm1 11.5a1 1 0 11-2 0V10a1 1 0 012 0v3.5zM10 8a1 1 0 100-2 1 1 0 000 2z" />
        </svg>
      </span>
    </div>
    <div [class]="saldoStatusClass">{{ saldoStatusText }}</div>
  </div>

  <div class="fc-surface p-6">
    <div class="mb-3 flex items-start justify-between gap-4">
      <div>
        <p class="text-sm text-zinc-400">Renda no periodo</p>
        <h2 class="mt-1 text-3xl font-bold text-emerald-400">{{ currency(totalRenda) }}</h2>
      </div>
      <span class="grid h-9 w-9 place-items-center rounded-xl border border-emerald-400/20 bg-emerald-500/10 text-emerald-300">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm.75-11.5a.75.75 0 00-1.5 0v3.19L7.28 7.72a.75.75 0 00-1.06 1.06l3.25 3.25a.75.75 0 001.06 0l3.25-3.25a.75.75 0 10-1.06-1.06l-1.97 1.97V6.5z" clip-rule="evenodd" />
        </svg>
      </span>
    </div>
    <button (click)="openRenda.emit()" class="fc-button fc-button-primary">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path
          fill-rule="evenodd"
          d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
          clip-rule="evenodd"
        />
      </svg>
      Nova Renda
    </button>
  </div>

  <div class="fc-surface p-6">
    <div class="mb-3 flex items-start justify-between gap-4">
      <div>
        <p class="text-sm text-zinc-400">Gasto vs Meta (periodo)</p>
        <h2 class="mt-1 text-3xl font-bold text-rose-400">{{ currency(totalGasto) }}</h2>
      </div>
      <span class="grid h-9 w-9 place-items-center rounded-xl border border-rose-400/20 bg-rose-500/10 text-rose-300">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm.75-11.5a.75.75 0 00-1.5 0v4.19L7.78 9.22a.75.75 0 00-1.06 1.06l2.75 2.75a.75.75 0 001.06 0l2.75-2.75a.75.75 0 10-1.06-1.06l-1.47 1.47V6.5z" clip-rule="evenodd" />
        </svg>
      </span>
    </div>
    <div class="fc-progress-track mt-4 h-2">
      <div [class]="progressClass" [style.width.%]="progress"></div>
    </div>
  </div>
</div>
