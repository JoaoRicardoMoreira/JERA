services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance_control_api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-finance_user}:${POSTGRES_PASSWORD:-finance_password}@postgres:5432/${POSTGRES_DB:-finance_control}?schema=public
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: finance_control_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance_control}
      POSTGRES_USER: ${POSTGRES_USER:-finance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres_test:
    image: postgres:16-alpine
    container_name: finance_control_postgres_test
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-finance_control_test}
      POSTGRES_USER: ${POSTGRES_TEST_USER:-finance_user}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-finance_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_test_data:
